<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SGD">
  <!-- Ícone da aplicação: a mesma marca do cabeçalho, no mesmo azul do Piloto
       (#0b3d91 → #3d7fe0). Vectorial porque tem de continuar legível a 16 px
       no separador do browser e a 512 px no ecrã inicial de um telemóvel. -->
  <defs>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d91"/>
      <stop offset="1" stop-color="#3d7fe0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#marca)"/>
  <text x="32" y="42.5" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif"
        font-size="27" font-weight="900" letter-spacing="-1.6" fill="#ffffff">SGD</text>
</svg>
