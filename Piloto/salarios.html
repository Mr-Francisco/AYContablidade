<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH — Processamento Salarial — SGD</title>
<script>(function(){var t=localStorage.getItem('sgd_theme')||localStorage.getItem('ay_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container-wide">
    <div class="page-head"><h1>Processamento Salarial</h1><p class="sub">Folha de salários com INSS e IRT (Angola). Processar lança automaticamente na contabilidade.</p></div>
    <div class="card">
      <div class="toolbar">
        <label style="margin:0">Mês de processamento
          <select id="fMes"></select>
        </label>
        <span id="info" class="sub"></span>
        <span style="flex:1"></span>
        <button class="btn btn-primary btn-sm" id="btnProcessar">⚙️ Processar e lançar</button>
        <button class="btn btn-outline btn-sm" id="btnCsv">⬇ CSV</button>
        <button class="btn btn-outline btn-sm" id="btnImprimir">🖨 Imprimir</button>
      </div>
    </div>
    <div class="card report-print" id="card"></div>
    <div class="card" id="reciboCard" style="display:none"></div>
  </div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/plano-primavera.js"></script>
<script src="assets/js/contabilidade.js"></script>
<script src="assets/js/rh.js"></script>
<script>
const u = AY.initPage("salarios.html", null);
if (u) {
  const E = AY.escapeHtml, R = AY.rh, C = AY.contab, m2 = AY.formatMoeda2, emp = AY.getEmpresa();
  const podeProcessar = AY.can("rh.gerir");
  // Mês (período) — usa os períodos contabilísticos 01-12
  const selMes = document.getElementById("fMes");
  (C.PERIODOS || []).filter(p => p[0] >= "01" && p[0] <= "12").forEach(p => selMes.appendChild(new Option(p[0] + " · " + p[1], p[0])));
  selMes.value = String(new Date().getMonth() + 1).padStart(2, "0");

  function render() {
    const ex = AY.exercicioAtivo(); const mes = selMes.value;
    const f = R.folha({ soAtivos: true, mes });
    const estado = R.estadoMes(mes), estLbl = { por_processar: "Por processar", processado: "Processado", pago: "Pago" }[estado];
    const estCor = { por_processar: "#d68910", processado: "#2980b9", pago: "#16a085" }[estado];
    document.getElementById("info").innerHTML = "Valores em " + E(AY.moeda()) + (ex ? " · " + E(ex.nome) : "") + " · " + AY.badge(estLbl, estCor);
    document.getElementById("card").innerHTML = `
      <div class="bal-cabecalho"><div><b>${E(emp.nome)}</b><br><span class="sub">Folha de Salários${ex ? " — " + E(ex.nome) : ""}</span></div><div class="sub">Valores em ${E(AY.moeda())}</div></div>
      <div class="table-wrap"><table class="dr-table">
        <thead><tr><th>Nº</th><th>Colaborador</th><th class="num">Base</th><th class="num">Subsídios</th><th class="num">Bruto</th><th class="num">INSS 3%</th><th class="num">Coletável</th><th class="num">IRT</th><th class="num">Líquido</th><th></th></tr></thead>
        <tbody>${f.linhas.length ? f.linhas.map(r => `<tr>
          <td><b>${E(r.colaborador.numero)}</b></td><td>${E(r.colaborador.nome)}</td>
          <td class="num">${m2(r.base)}</td><td class="num">${m2(r.subs)}</td><td class="num">${m2(r.bruto)}</td>
          <td class="num">${m2(r.inss)}</td><td class="num">${m2(r.materia)}</td><td class="num">${m2(r.irt)}</td>
          <td class="num"><b>${m2(r.liquido)}</b></td>
          <td class="num"><button class="btn btn-sm btn-outline no-print" data-recibo="${r.colaborador.id}">Recibo</button></td></tr>`).join("") : `<tr><td colspan="10" class="empty">Sem colaboradores activos. Regista em Gestão de Pessoal.</td></tr>`}</tbody>
        <tfoot><tr class="dr-total"><td colspan="4"><b>TOTAIS</b></td><td class="num">${m2(f.totais.bruto)}</td><td class="num">${m2(f.totais.inss)}</td><td></td><td class="num">${m2(f.totais.irt)}</td><td class="num">${m2(f.totais.liquido)}</td><td></td></tr></tfoot>
      </table></div>
      <p class="sub" style="margin-top:8px">INSS empresa (8%): <b>${m2(f.totais.inssEmpresa)}</b> · Custo total para a empresa: <b>${m2(AY.round2(f.totais.bruto + f.totais.inssEmpresa))}</b>. Ao processar: débito remunerações (${R.cfg().contaCusto}) · crédito líquido (${R.cfg().contaPagar}), IRT (${R.cfg().contaIRT}), INSS (${R.cfg().contaINSS}).</p>`;
    document.querySelectorAll("[data-recibo]").forEach(b => b.onclick = () => mostrarRecibo(b.dataset.recibo));
  }
  function mostrarRecibo(id) {
    const c = R.colaborador(id); if (!c) return; const r = R.recibo(c, selMes.value);
    const linha = (l, v, neg) => `<tr><td>${E(l)}</td><td class="num">${neg ? "(" + m2(Math.abs(v)) + ")" : m2(v)}</td></tr>`;
    document.getElementById("reciboCard").style.display = "";
    document.getElementById("reciboCard").innerHTML = `
      <div class="card-title">Recibo de Vencimento — ${E(c.nome)} <span class="tag">Nº ${E(c.numero)}</span></div>
      <div class="grid-2" style="align-items:start">
        <div class="table-wrap"><table><tbody>
          ${linha("Salário base", r.base)}${linha("Subsídios", r.subs)}
          <tr style="font-weight:700;border-top:2px solid var(--border)"><td>Remuneração bruta</td><td class="num">${m2(r.bruto)}</td></tr>
          ${linha("INSS (3%)", -r.inss, true)}${linha("IRT", -r.irt, true)}
          <tr class="dr-total"><td><b>Líquido a receber</b></td><td class="num"><b>${m2(r.liquido)}</b></td></tr>
        </tbody></table></div>
        <div><p class="sub">Matéria coletável IRT: <b>${m2(r.materia)}</b></p><p class="sub">INSS a cargo da empresa (8%): <b>${m2(r.inssEmpresa)}</b></p><p class="sub">Categoria: ${E(c.categoria || "—")}</p></div>
      </div>`;
    document.getElementById("reciboCard").scrollIntoView({ behavior: "smooth" });
  }
  document.getElementById("btnProcessar").style.display = podeProcessar ? "" : "none";
  document.getElementById("btnProcessar").onclick = () => {
    const mes = selMes.value;
    const f = R.folha({ soAtivos: true, mes });
    if (f.totais.bruto <= 0) { AY.toast("Sem valores a processar.", "info"); return; }
    if (R.mesPago(mes)) { AY.toast("Este mês já foi pago — não pode ser reprocessado.", "info"); return; }
    if (!confirm("Processar salários de " + selMes.options[selMes.selectedIndex].text + " (líquido " + AY.formatKz(f.totais.liquido) + ") e lançar na contabilidade?")) return;
    const r = R.processarMes(mes);
    if (r.erro && !r.lancado) AY.toast("Processado, mas o lançamento falhou: " + r.erro, "info");
    else AY.toast(r.colaboradores + " colaborador(es) processados · líquido " + AY.formatKz(r.totais.liquido) + (r.lancado ? " · lançado na contabilidade" : ""), "success");
    render();
  };
  selMes.onchange = render;
  function csv() {
    const f = R.folha({ soAtivos: true, mes: selMes.value });
    const rows = [["Nº", "Colaborador", "Base", "Subsídios", "Bruto", "INSS", "Coletável", "IRT", "Líquido"]]
      .concat(f.linhas.map(r => [r.colaborador.numero, r.colaborador.nome, r.base, r.subs, r.bruto, r.inss, r.materia, r.irt, r.liquido]));
    const s = rows.map(r => r.map(v => { v = String(v == null ? "" : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + s], { type: "text/csv;charset=utf-8" })); a.download = "Folha_Salarios.csv"; a.click();
  }
  document.getElementById("btnCsv").onclick = csv;
  document.getElementById("btnImprimir").onclick = () => window.print();
  render();
}
</script>
</body>
</html>
