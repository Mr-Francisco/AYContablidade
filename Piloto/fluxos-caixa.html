<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxos de Caixa — SGD</title>
<script>(function(){var t=localStorage.getItem('sgd_theme')||localStorage.getItem('ay_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container">
    <div class="page-head"><h1>Demonstração de Fluxos de Caixa</h1><p class="sub">Método direto: todos os movimentos de caixa (45) e bancos (43) alimentam o fluxo, classificados pela rúbrica indicada no lançamento (obrigatória nessas contas) ou, na sua falta, pela contraparte.</p></div>
    <div class="card">
      <div class="toolbar">
        <label style="margin:0">Exercício <select id="fExercicio"></select></label>
        <label style="margin:0">De <input type="date" id="fDe"></label>
        <label style="margin:0">Até <input type="date" id="fAte"></label>
        <button class="btn btn-outline btn-sm" id="btnImprimir" style="margin-left:auto">🖨 Imprimir</button>
      </div>
    </div>
    <div class="grid-3" id="kpis" style="margin-bottom:16px"></div>
    <div class="card report-print" id="cardMapa"></div>
  </div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/plano-primavera.js"></script>
<script src="assets/js/contabilidade.js"></script>
<script>
const u = AY.initPage("fluxos-caixa.html", null);
if (u) {
  const E = AY.escapeHtml, C = AY.contab, m2 = AY.formatMoeda2;
  document.getElementById("fExercicio").innerHTML = AY.exercicioOptions().html;
  // Ao mudar de exercício, propõe De/Até = início/fim desse exercício (o utilizador pode ajustar).
  document.getElementById("fExercicio").addEventListener("change", () => {
    const ex = AY.exercicioOptions(document.getElementById("fExercicio").value).selecionado;
    if (ex) { document.getElementById("fDe").value = ex.inicio || ""; document.getElementById("fAte").value = ex.fim || ""; }
    render();
  });
  function render() {
    const ex = AY.exercicioOptions(document.getElementById("fExercicio").value).selecionado, emp = AY.getEmpresa();
    const exAnt = AY.exercicioAnterior(ex);
    const de = document.getElementById("fDe").value || null, ate = document.getElementById("fAte").value || null;
    const d = C.demonstracaoFluxos({ exercicioId: ex ? ex.id : null, de, ate });
    // O comparativo do exercício anterior usa sempre o ano completo desse exercício (tal como
    // Balanço/DR/Notas), independentemente do De/Até aplicado ao exercício em análise.
    const dAnt = exAnt ? C.demonstracaoFluxos({ exercicioId: exAnt.id, de: exAnt.inicio, ate: exAnt.fim }) : null;
    document.getElementById("kpis").innerHTML = [
      AY.kpi("Atividades Operacionais", m2(d.subtotais.Operacional), "fluxo líquido", d.subtotais.Operacional >= 0 ? "#16a085" : "#c0392b"),
      AY.kpi("Investimento", m2(d.subtotais.Investimento), "fluxo líquido", d.subtotais.Investimento >= 0 ? "#16a085" : "#c0392b"),
      AY.kpi("Financiamento", m2(d.subtotais.Financiamento), "fluxo líquido", d.subtotais.Financiamento >= 0 ? "#16a085" : "#c0392b"),
    ].join("");
    const valAnt = v => v ? m2(v) : "—";
    const grupoHTML = (g) => { const rubricas = Object.entries(d.grupos[g]); const gAnt = dAnt ? dAnt.grupos[g] : null; return `
      <tr class="bal-sub"><td colspan="2"><b>Atividades ${g === "Operacional" ? "Operacionais" : "de " + g}</b></td><td class="num"><b>${m2(d.subtotais[g])}</b></td><td class="num"><b>${dAnt ? valAnt(dAnt.subtotais[g]) : "—"}</b></td></tr>
      ${rubricas.length ? rubricas.map(([r, v]) => `<tr><td></td><td>${E(r)}</td><td class="num" style="color:${v < 0 ? "var(--danger)" : v > 0 ? "var(--success)" : "inherit"}">${m2(v)}</td><td class="num">${gAnt ? valAnt(gAnt[r]) : "—"}</td></tr>`).join("") : `<tr><td></td><td class="sub">— sem movimentos —</td><td></td><td></td></tr>`}`; };
    document.getElementById("cardMapa").innerHTML = `
      <div class="bal-cabecalho"><div><b>${E(emp.nome)}</b><br><span class="sub">Demonstração de Fluxos de Caixa (método direto)${ex ? " — " + E(ex.nome) : ""}</span></div><div class="sub">Valores em ${E(AY.moeda())}</div></div>
      <div class="table-wrap"><table class="bal-table">
        <thead><tr><th style="width:60px">Grupo</th><th>Rúbrica</th><th class="num">${ex ? (ex.inicio || "").slice(0, 4) : "Valor"}</th><th class="num">${exAnt ? (exAnt.inicio || "").slice(0, 4) : "Ano Anterior"}</th></tr></thead>
        <tbody>${grupoHTML("Operacional")}${grupoHTML("Investimento")}${grupoHTML("Financiamento")}</tbody>
        <tfoot>
          <tr class="bal-total"><td colspan="2"><b>VARIAÇÃO LÍQUIDA DE CAIXA E EQUIVALENTES</b></td><td class="num"><b>${m2(d.variacao)}</b></td><td class="num"><b>${dAnt ? valAnt(dAnt.variacao) : "—"}</b></td></tr>
          <tr><td colspan="2">Caixa e equivalentes no início do período</td><td class="num">${m2(d.saldoInicial)}</td><td class="num">${dAnt ? valAnt(dAnt.saldoInicial) : "—"}</td></tr>
          <tr class="bal-total"><td colspan="2"><b>Caixa e equivalentes no fim do período</b></td><td class="num"><b>${m2(d.saldoFinal)}</b></td><td class="num"><b>${dAnt ? valAnt(dAnt.saldoFinal) : "—"}</b></td></tr>
        </tfoot>
      </table></div>
      <p class="sub" style="margin-top:8px">Alimentado automaticamente por todos os movimentos que envolvem contas de caixa (45) e bancos (43); a rúbrica é a indicada no lançamento (obrigatória nessas contas) ou, na sua falta, a determinada pela contraparte do movimento.</p>`;
  }
  ["fDe", "fAte"].forEach(id => document.getElementById(id).onchange = render);
  document.getElementById("btnImprimir").onclick = () => window.print();
  // Arranque: propõe De/Até = início/fim do exercício selecionado por omissão.
  { const ex0 = AY.exercicioOptions().selecionado; if (ex0) { document.getElementById("fDe").value = ex0.inicio || ""; document.getElementById("fAte").value = ex0.fim || ""; } }
  render();
}
</script>
</body>
</html>
