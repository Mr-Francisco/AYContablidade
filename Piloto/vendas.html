<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comercial — Vendas — SGD</title>
<script>(function(){var t=localStorage.getItem('sgd_theme')||localStorage.getItem('ay_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container-wide">
    <div class="page-head"><h1>Vendas</h1><p class="sub">Emissão de documentos do Regime Jurídico das Facturas e Documentos Equivalentes (Decreto Presidencial n.º 71/25). Ao emitir, lança na contabilidade e na conta corrente do cliente.</p></div>
    <div class="grid-4" id="kpis" style="margin-bottom:16px"></div>
    <div class="card">
      <div class="toolbar">
        <input type="search" id="busca" placeholder="Pesquisar (nº, tipo ou cliente)…" class="grow">
        <select id="fFiltroTipo"><option value="">Todos os tipos</option></select>
        <button class="btn btn-amber" id="novo">+ Novo documento</button>
      </div>
      <div class="table-wrap" id="tabela"></div>
    </div>
  </div>
</main>

<!-- Modal de edição -->
<div class="modal-backdrop hidden" id="modal"><div class="modal" style="max-width:820px">
  <div class="modal-head"><b id="mTitulo">Novo documento</b><button class="icon-btn" id="fechar">✕</button></div>
  <form id="form">
    <div class="grid-4">
      <label>Tipo de documento<select id="fTipoDoc" required></select></label>
      <label>Cliente<select id="fCliente"></select></label>
      <label>Natureza<select id="fTipo"><option value="produtos">Produtos</option><option value="servicos">Serviços</option></select></label>
      <label>Data <span style="color:var(--danger)">*</span><input type="date" id="fData" required></label>
    </div>
    <div class="grid-4" style="margin-top:2px">
      <label id="wVend">Vendedor<select id="fVend"><option value="">—</option></select></label>
      <label id="wConta" style="display:none">Conta de recebimento<select id="fConta"></select></label>
      <label id="wOrigem" style="display:none">Documento de origem<select id="fOrigem"><option value="">—</option></select></label>
      <label id="wMotivo" style="display:none">Motivo<input id="fMotivo" placeholder="Ex.: Devolução / correção"></label>
    </div>
    <div class="table-wrap" style="margin-top:8px"><table class="lanc-table">
      <thead><tr><th style="width:20%">Artigo</th><th>Descrição</th><th class="num" style="width:12%">Qtd</th><th class="num" style="width:18%">Preço</th><th class="num" style="width:18%">Total</th><th style="width:34px"></th></tr></thead>
      <tbody id="linhas"></tbody>
    </table></div>
    <datalist id="artigosList"></datalist>
    <div class="list-actions" style="margin-top:8px"><button type="button" class="btn btn-outline btn-sm" id="addLinha">+ Linha</button>
      <label id="wIva" style="margin:0 0 0 auto;display:flex;align-items:center;gap:6px">IVA % <input type="number" id="fIva" step="0.1" min="0" style="width:80px"></label></div>
    <div class="cc-resumo" style="justify-content:flex-end;margin-top:8px">
      <span>Incidência <b id="rSub">0,00</b></span><span>IVA <b id="rIva">0,00</b></span><span>Total <b id="rTot">0,00</b></span>
    </div>
    <div id="erro" class="alert alert-error hidden" style="margin-top:8px"></div>
    <div class="modal-actions"><button type="button" class="btn btn-outline" id="cancelar">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div>
  </form>
</div></div>

<!-- Modal do documento legal -->
<div class="modal-backdrop hidden" id="docModal"><div class="modal" style="max-width:720px">
  <div class="modal-head"><b>Documento</b><button class="icon-btn" id="docFechar">✕</button></div>
  <div id="docPrint"></div>
  <div class="modal-actions">
    <label style="margin:0 auto 0 0;display:flex;align-items:center;gap:6px">Formato <select id="docFormato"><option value="a4">A4 (fatura)</option><option value="pos">POS — talão 80mm</option></select></label>
    <button type="button" class="btn btn-outline" id="docImprimir">🖨 Imprimir</button><button type="button" class="btn btn-primary" id="docOk">Fechar</button>
  </div>
</div></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/plano-primavera.js"></script>
<script src="assets/js/contabilidade.js"></script>
<script src="assets/js/comercial.js"></script>
<script src="assets/js/logistica.js"></script>
<script src="assets/js/fatura-doc.js"></script>
<script>
const u = AY.initPage("vendas.html", null);
if (u) {
  const E = AY.escapeHtml, M = AY.com, m2 = AY.formatMoeda2, emp = AY.getEmpresa(); let editId = null;
  const podeGerir = AY.can("comercial.gerir");
  document.getElementById("fFiltroTipo").innerHTML = `<option value="">Todos os tipos</option>` + M.TIPOS_DOC.map(t => `<option value="${t.cod}">${t.cod} · ${E(t.nome)}</option>`).join("");

  function render() {
    const q = (document.getElementById("busca").value || "").toLowerCase().trim(), ft = document.getElementById("fFiltroTipo").value;
    let rows = M.vendas().slice().sort((a, b) => (b.data || "").localeCompare(a.data || "") || (b.criadoEm || "").localeCompare(a.criadoEm || ""));
    if (ft) rows = rows.filter(v => (v.tipoDoc || "FT") === ft);
    if (q) rows = rows.filter(v => ((v.numero || "") + " " + (v.tipoDoc || "") + " " + (v.clienteNome || "")).toLowerCase().includes(q));
    const r = M.resumo();
    document.getElementById("kpis").innerHTML = [
      AY.kpi("Faturado (emitido)", AY.formatKz(r.totalFaturado), r.nFaturadas + " documentos", "#16a085"),
      AY.kpi("Por emitir", AY.formatKz(r.porFaturar), (r.nVendas - r.nFaturadas) + " rascunhos", "var(--chart-amber)"),
      AY.kpi("Total", AY.formatKz(r.totalVendas), r.nVendas + " documentos", "#8e44ad"),
      AY.kpi("Clientes", M.clientes().length, "", "var(--chart-blue)"),
    ].join("");
    document.getElementById("tabela").innerHTML = rows.length ? `<table>
      <thead><tr><th>Documento</th><th>Data</th><th>Cliente</th><th class="num">Incidência</th><th class="num">IVA</th><th class="num">Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>${rows.map(v => { const td = M.tipoDoc(v.tipoDoc || "FT"), emit = M.emitida(v);
        return `<tr>
        <td><b>${E(v.numero || td.cod + " (rascunho)")}</b><br><small class="sub">${E(td.nome)}</small></td>
        <td>${AY.formatDate(v.data)}</td><td>${E(v.clienteNome || "Consumidor final")}</td>
        <td class="num">${m2(v.subtotal)}</td><td class="num">${m2(v.iva)}</td><td class="num"><b>${m2(v.total)}</b></td>
        <td>${emit ? AY.badge("Emitido", "#16a085") : AY.badge("Rascunho", "#d68910")}</td>
        <td class="num">${emit
          ? `<button class="btn btn-sm btn-outline" data-doc="${v.id}">Ver documento</button>${v.numeroOp ? ` <a class="btn btn-sm btn-outline" href="movimentos.html?id=${v.lancamentoId}">${E(v.numeroOp)}</a>` : ""}`
          : (podeGerir ? `<button class="btn btn-sm btn-primary" data-emitir="${v.id}">Emitir</button> <button class="btn btn-sm btn-outline" data-edit="${v.id}">Editar</button> <button class="btn btn-sm btn-outline" data-del="${v.id}">✕</button>` : "")}</td>
      </tr>`; }).join("")}</tbody></table>` : `<div class="empty">Sem documentos registados.</div>`;
    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => abrir(b.dataset.edit));
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const v = M.venda(b.dataset.del); if (confirm("Eliminar " + (v.numero || "o rascunho") + "?")) { M.removeVenda(b.dataset.del); render(); } });
    document.querySelectorAll("[data-emitir]").forEach(b => b.onclick = () => emitir(b.dataset.emitir));
    document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => verDoc(b.dataset.doc));
  }
  function emitir(id) {
    const v = M.venda(id), td = M.tipoDoc(v.tipoDoc || "FT");
    if (!confirm("Emitir " + td.nome + " no valor de " + AY.formatKz(v.total) + (td.contab !== "nenhum" ? " e lançar na contabilidade?" : "?"))) return;
    try {
      const r = M.emitir(id); render();
      AY.toast(td.nome + " emitido" + (r.lancamento ? " · lançamento " + (r.lancamento.numeroOp || "") : "") + ((r.venda.stockMovs || []).length ? " · stock baixado (" + r.venda.stockMovs.length + ")" : "") + ".", "success");
      if (r.avisosStock && r.avisosStock.length) AY.toast("Stock: " + r.avisosStock.join(" · "), "info");
      verDoc(id);
    }
    catch (e) { AY.toast("Erro ao emitir: " + e.message, "info"); }
  }

  // ---------- Modal de edição ----------
  const modal = document.getElementById("modal"), selCli = document.getElementById("fCliente"), selVend = document.getElementById("fVend");
  const selTipoDoc = document.getElementById("fTipoDoc"), selConta = document.getElementById("fConta"), selOrigem = document.getElementById("fOrigem");
  selTipoDoc.innerHTML = M.TIPOS_DOC.map(t => `<option value="${t.cod}">${t.cod} · ${E(t.nome)}</option>`).join("");
  selConta.innerHTML = AY.contab.contasMovimento().filter(c => /^4[35]/.test(c.codigo)).map(c => `<option value="${E(c.codigo)}">${E(c.codigo)} · ${E(c.nome)}</option>`).join("");
  // Artigos (opcional por linha): ao escolher um artigo, baixa o stock e lança o CMVMC ao emitir
  const dlArt = document.getElementById("artigosList");
  if (AY.log && dlArt) dlArt.innerHTML = AY.log.artigos().map(a => `<option value="${E(a.codigo)}">${E(a.codigo)} · ${E(a.descricao)}</option>`).join("");

  function encherSelects() {
    selCli.innerHTML = `<option value="">— Consumidor final —</option>` + M.clientes().filter(c => c.estado !== "inactivo").map(c => `<option value="${c.id}">${E(c.nome)}</option>`).join("");
    selVend.innerHTML = `<option value="">—</option>` + M.vendedores().map(v => `<option value="${v.id}">${E(v.nome)}</option>`).join("");
  }
  function encherOrigem() {
    const cliId = selCli.value;
    const emitidos = M.vendas().filter(v => M.emitida(v) && ["FT", "FR", "FG", "FS", "ND"].includes(v.tipoDoc || "FT") && (!cliId || v.clienteId === cliId));
    selOrigem.innerHTML = `<option value="">—</option>` + emitidos.map(v => `<option value="${v.id}">${E(v.numero)} · ${AY.formatKz(v.total)}</option>`).join("");
  }
  function aplicarTipo() {
    const td = M.tipoDoc(selTipoDoc.value);
    document.getElementById("wConta").style.display = td.pagamento ? "" : "none";
    document.getElementById("wOrigem").style.display = td.ref ? "" : "none";
    document.getElementById("wMotivo").style.display = (td.cod === "NC" || td.cod === "ND") ? "" : "none";
    document.getElementById("wIva").style.display = td.iva ? "flex" : "none";
    if (td.ref) encherOrigem();
    recalc();
  }
  function novaLinha(d) {
    const tb = document.getElementById("linhas"); const tr = document.createElement("tr");
    tr.innerHTML = `<td><input class="l-art" list="artigosList" placeholder="Código (opcional)"></td><td><input class="l-desc" placeholder="Descrição"></td><td><input class="l-qtd num-input" type="number" step="1" min="0" value="1"></td><td><input class="l-preco num-input" type="number" step="0.01" min="0"></td><td class="num l-tot">0,00</td><td><button type="button" class="icon-btn l-del">✕</button></td>`;
    tb.appendChild(tr);
    if (d) {
      tr.querySelector(".l-desc").value = d.descricao || ""; tr.querySelector(".l-qtd").value = d.qtd || 1; tr.querySelector(".l-preco").value = d.preco || "";
      if (d.artigoId) { tr.dataset.artigoId = d.artigoId; tr.dataset.unidade = d.unidade || ""; const a = AY.log && AY.log.artigo(d.artigoId); if (a) tr.querySelector(".l-art").value = a.codigo; }
    }
    // Ao indicar o artigo: guarda o id e pré-preenche descrição/preço se estiverem vazios
    tr.querySelector(".l-art").addEventListener("change", () => {
      const a = AY.log ? AY.log.artigoPorCodigo(tr.querySelector(".l-art").value.trim()) : null;
      if (a) {
        tr.dataset.artigoId = a.id; tr.dataset.unidade = a.unidade || "";
        if (!tr.querySelector(".l-desc").value.trim()) tr.querySelector(".l-desc").value = a.descricao;
        if (!(Number(tr.querySelector(".l-preco").value) > 0)) tr.querySelector(".l-preco").value = a.precoVenda || "";
      } else { tr.dataset.artigoId = ""; tr.dataset.unidade = ""; }
      recalc();
    });
    tr.querySelectorAll("input").forEach(i => i.addEventListener("input", recalc));
    tr.querySelector(".l-del").onclick = () => { tr.remove(); recalc(); };
    recalc();
  }
  function lerLinhas() { return Array.from(document.querySelectorAll("#linhas tr")).map(tr => ({ artigoId: tr.dataset.artigoId || "", unidade: tr.dataset.unidade || "", descricao: tr.querySelector(".l-desc").value.trim(), qtd: Number(tr.querySelector(".l-qtd").value) || 0, preco: Number(tr.querySelector(".l-preco").value) || 0 })).filter(l => l.descricao || l.preco); }
  function recalc() {
    const td = M.tipoDoc(selTipoDoc.value); const ivaP = td.iva ? document.getElementById("fIva").value : 0;
    document.querySelectorAll("#linhas tr").forEach(tr => { const t = (Number(tr.querySelector(".l-qtd").value) || 0) * (Number(tr.querySelector(".l-preco").value) || 0); tr.querySelector(".l-tot").textContent = m2(t); });
    const t = M.calcTotais(lerLinhas(), ivaP);
    document.getElementById("rSub").textContent = m2(t.subtotal); document.getElementById("rIva").textContent = m2(t.iva); document.getElementById("rTot").textContent = m2(t.total);
  }
  selOrigem.onchange = () => {
    const o = M.venda(selOrigem.value); if (!o) return;
    document.getElementById("linhas").innerHTML = ""; (o.linhas || []).forEach(l => novaLinha(l)); if (M.tipoDoc(selTipoDoc.value).iva) document.getElementById("fIva").value = o.ivaPerc;
    recalc();
  };
  function abrir(id) {
    editId = id || null; encherSelects(); const v = id ? M.venda(id) : null;
    document.getElementById("mTitulo").textContent = v ? "Editar " + (v.numero || "documento") : "Novo documento";
    selTipoDoc.value = v ? (v.tipoDoc || "FT") : "FT";
    selCli.value = v ? (v.clienteId || "") : ""; selVend.value = v ? (v.vendedorId || "") : "";
    document.getElementById("fTipo").value = v ? (v.tipo || "produtos") : "produtos";
    document.getElementById("fData").value = v ? v.data : AY.hojeData();
    document.getElementById("fIva").value = v ? v.ivaPerc : AY.taxaIVA();
    selConta.value = v && v.contaRecebimento ? v.contaRecebimento : M.cfg().contaCaixa;
    document.getElementById("fMotivo").value = v ? (v.motivo || "") : "";
    aplicarTipo();
    selOrigem.value = v ? (v.docOrigemId || "") : "";
    document.getElementById("linhas").innerHTML = ""; (v && v.linhas.length ? v.linhas : [null]).forEach(l => novaLinha(l));
    document.getElementById("erro").classList.add("hidden"); modal.classList.remove("hidden"); recalc();
  }
  document.getElementById("novo").onclick = () => abrir(null);
  document.getElementById("fechar").onclick = () => modal.classList.add("hidden");
  document.getElementById("cancelar").onclick = () => modal.classList.add("hidden");
  document.getElementById("addLinha").onclick = () => novaLinha();
  document.getElementById("fIva").oninput = recalc;
  selTipoDoc.onchange = aplicarTipo; selCli.onchange = () => { if (M.tipoDoc(selTipoDoc.value).ref) encherOrigem(); };
  document.getElementById("novo").style.display = podeGerir ? "" : "none";
  document.getElementById("busca").oninput = render; document.getElementById("fFiltroTipo").onchange = render;
  document.getElementById("form").onsubmit = e => {
    e.preventDefault(); const err = document.getElementById("erro"); const td = M.tipoDoc(selTipoDoc.value);
    const dataDoc = document.getElementById("fData").value;
    if (!dataDoc) { err.textContent = "Indica a data do documento."; err.classList.remove("hidden"); document.getElementById("fData").focus(); return; }
    if (td.exigeCliente && !selCli.value) { err.textContent = td.nome + " exige a identificação do cliente."; err.classList.remove("hidden"); return; }
    const linhas = lerLinhas(); if (!linhas.length) { err.textContent = "Adiciona pelo menos uma linha."; err.classList.remove("hidden"); return; }
    const o = M.venda(selOrigem.value);
    try {
      M.saveVenda({ id: editId, tipoDoc: selTipoDoc.value, clienteId: selCli.value || null, vendedorId: selVend.value || null, tipo: document.getElementById("fTipo").value,
        data: dataDoc, ivaPerc: td.iva ? (Number(document.getElementById("fIva").value) || 0) : 0, linhas,
        contaRecebimento: td.pagamento ? selConta.value : null, docOrigemId: td.ref ? (selOrigem.value || null) : null, docOrigemNum: o ? o.numero : null, motivo: document.getElementById("fMotivo").value.trim() || null });
    } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); return; }
    modal.classList.add("hidden"); render(); AY.toast("Documento guardado.", "success");
  };

  // Documento legal — render partilhado em assets/js/fatura-doc.js (AY.faturaDoc.render)
  const docModal = document.getElementById("docModal");
  function verDoc(id) { const v = M.venda(id); if (!v) return; document.getElementById("docPrint").innerHTML = AY.faturaDoc.render(v); docModal.classList.remove("hidden"); }
  document.getElementById("docFechar").onclick = () => docModal.classList.add("hidden");
  document.getElementById("docOk").onclick = () => docModal.classList.add("hidden");
  document.getElementById("docImprimir").onclick = () => AY.faturaDoc.imprimir(document.getElementById("docFormato").value);
  render();
}
</script>
</body>
</html>
