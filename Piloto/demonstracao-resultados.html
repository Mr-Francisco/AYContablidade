<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demonstração de Resultados — SGD</title>
<script>(function(){var t=localStorage.getItem('sgd_theme')||localStorage.getItem('ay_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container">
    <div class="page-head"><h1>Demonstração de Resultados</h1><p class="sub">Por naturezas (PGC Angola) — apurada do balancete do exercício.</p></div>
    <div class="card">
      <div class="toolbar">
        <label style="margin:0">Exercício <select id="fExercicio"></select></label>
        <span id="periodoInfo" class="sub"></span>
        <span style="flex:1"></span>
        <button class="btn btn-primary btn-sm" id="btnAtualizar">🔄 Atualizar</button>
        <button class="btn btn-outline btn-sm" id="btnCsv">⬇ CSV</button>
        <button class="btn btn-outline btn-sm" id="btnImprimir">🖨 Imprimir</button>
      </div>
    </div>
    <div class="card report-print" id="card"></div>
    <div class="card" id="cardApuramento"></div>
  </div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/plano-primavera.js"></script>
<script src="assets/js/contabilidade.js"></script>
<script>
const u = AY.initPage("demonstracao-resultados.html", null);
if (u) {
  const E = AY.escapeHtml, C = AY.contab, m2 = AY.formatMoeda2, emp = AY.getEmpresa();
  let ultimo = null;
  document.getElementById("fExercicio").innerHTML = AY.exercicioOptions().html;
  function render() {
    const ex = AY.exercicioOptions(document.getElementById("fExercicio").value).selecionado;
    const exAnt = AY.exercicioAnterior(ex);
    const dr = C.demonstracaoResultados({ exercicioId: ex ? ex.id : null });
    const drAnt = exAnt ? C.demonstracaoResultados({ exercicioId: exAnt.id }) : null;
    ultimo = dr;
    const anoAtual = ex ? (ex.inicio || "").slice(0, 4) : new Date().getFullYear();
    const anoAnt = exAnt ? (exAnt.inicio || "").slice(0, 4) : (anoAtual ? (Number(anoAtual) - 1) : "");
    document.getElementById("periodoInfo").textContent = "Valores em " + AY.moeda() + (ex ? " · " + ex.nome : "");
    const val = v => v ? m2(v) : "—";
    // A estrutura da DR é sempre fixa (mesma ordem/linhas), por isso a linha correspondente do
    // exercício anterior está sempre na mesma posição — junta-se por índice.
    document.getElementById("card").innerHTML = `
      <div class="bal-cabecalho"><div><b>${E(emp.nome)}</b><br><span class="sub">Demonstração de Resultados em 31 de Dezembro de ${anoAtual}${ex ? " — " + E(ex.nome) : ""}</span></div><div class="sub">Valores em ${E(AY.moeda())}</div></div>
      <div class="table-wrap"><table class="dr-table">
        <thead><tr><th>Designação</th><th class="num" style="width:70px">Notas</th><th class="num" style="width:150px">${anoAtual}</th><th class="num" style="width:150px">${anoAnt}</th></tr></thead>
        <tbody>${dr.linhas.map((l, i) => {
          const cls = l.tipo === "total" ? "dr-total" : l.tipo === "subtotal" ? "dr-sub" : "";
          const valorAnt = drAnt ? drAnt.linhas[i].valor : null;
          return `<tr class="${cls}"><td>${l.tipo === "linha" ? "" : "<b>"}${E(l.designacao)}${l.tipo === "linha" ? "" : "</b>"}</td>
            <td class="num">${l.nota ? `<a href="notas.html?nota=${l.nota}" class="brand-text">${l.nota}</a>` : ""}</td><td class="num">${val(l.valor)}</td><td class="num">${valorAnt != null ? val(valorAnt) : "—"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>`;
  }
  function csv() {
    if (!ultimo) return;
    const rows = [["Designação", "Notas", "Valor"]].concat(ultimo.linhas.map(l => [l.designacao, l.nota, l.valor]));
    const s = rows.map(r => r.map(v => { v = String(v == null ? "" : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + s], { type: "text/csv;charset=utf-8" })); a.download = "Demonstracao_Resultados.csv"; a.click();
  }
  document.getElementById("fExercicio").onchange = () => { render(); renderApuramento(); };
  document.getElementById("btnAtualizar").onclick = () => { render(); renderApuramento(); AY.toast("Demonstração atualizada.", "success"); };
  document.getElementById("btnCsv").onclick = csv;
  document.getElementById("btnImprimir").onclick = () => window.print();

  // ---------- Apuramento de Resultados (fecho automático) ----------
  const podeFechar = AY.can("contab.fechar");
  function renderApuramento() {
    const host = document.getElementById("cardApuramento");
    const ex = AY.exercicioOptions(document.getElementById("fExercicio").value).selecionado;
    if (!ex) { host.innerHTML = `<div class="card-title">Apuramento de Resultados</div><div class="empty">Cria um exercício em Configurações para poder apurar.</div>`; return; }
    const ap = ex.apuramento;
    if (ap) {
      host.innerHTML = `
        <div class="toolbar" style="margin-bottom:0">
          <b class="grow">Apuramento de Resultados</b>
          ${AY.badge("Apurado em " + AY.formatDate(ap.em), "#16a085")}
          ${podeFechar ? `<button class="btn btn-outline btn-sm" id="btnReabrir">↺ Reabrir apuramento</button>` : ""}
        </div>
        <div class="cc-resumo" style="margin-top:10px">
          <span>Até <b>${AY.formatDate(ap.ate)}</b></span>
          <span>Resultado Líquido <b style="color:${ap.resultado >= 0 ? '#16a085' : 'var(--danger)'}">${ap.resultado >= 0 ? "" : "−"}${m2(Math.abs(ap.resultado))} ${E(AY.moeda())}</b></span>
          <span>Lançamentos <b>${ap.lancamentoIds.length}</b></span>
        </div>
        <div class="table-wrap" style="margin-top:10px"><table>
          <thead><tr><th>Categoria</th><th class="num">Resultado</th><th></th></tr></thead>
          <tbody>${(ap.detalhe || []).map(d => `<tr>
            <td>${E(d.nome)}</td>
            <td class="num">${d.resultado >= 0 ? "" : "−"}${m2(Math.abs(d.resultado))}</td>
            <td class="num"><a class="btn btn-sm btn-outline" href="movimentos.html?id=${d.lancamentoId}">Ver lançamento</a></td>
          </tr>`).join("")}</tbody>
        </table></div>
        <p class="sub" style="margin-top:8px">O apuramento fecha as contas de Custos/Proveitos (classes 6/7) para as subcontas de Resultados (classe 8), transferindo o líquido para Resultados Transitados (8111). Podes reabrir e apurar de novo em segurança — os lançamentos anteriores são substituídos, nunca duplicados.</p>`;
      if (podeFechar) document.getElementById("btnReabrir").onclick = () => {
        if (!confirm("Reabrir o apuramento? Os " + ap.lancamentoIds.length + " lançamento(s) de fecho gerados serão eliminados.")) return;
        C.reabrirApuramento(ex.id); render(); renderApuramento(); AY.toast("Apuramento reaberto.", "info");
      };
    } else {
      const dr = ultimo || C.demonstracaoResultados({ exercicioId: ex.id });
      // Data do apuramento: por omissão o último dia do exercício, mas o utilizador pode indicar outra.
      const dataOmissao = /^\d{4}-\d{2}-\d{2}$/.test(ex.fim || "") ? ex.fim : "";
      host.innerHTML = `
        <div class="toolbar" style="margin-bottom:0">
          <b class="grow">Apuramento de Resultados</b>
          ${AY.badge("Por apurar", "#d68910")}
        </div>
        <div class="toolbar" style="margin-top:8px">
          <label style="margin:0">Data do apuramento <input type="date" id="fDataApuramento" value="${E(dataOmissao)}"></label>
          ${podeFechar ? `<button class="btn btn-primary btn-sm" id="btnApurar">🧮 Apurar Resultados do Exercício</button>` : ""}
        </div>
        <p class="sub" style="margin-top:8px">Fecha automaticamente as contas de Custos e Proveitos (classes 6/7) do exercício <b>${E(ex.nome)}</b> para as contas de Resultados (classe 8), gerando os lançamentos de apuramento no diário 81 (período 14 · Apuramento de Resultados), na data indicada acima. Resultado líquido atual (não apurado): <b style="color:${dr.liquido >= 0 ? '#16a085' : 'var(--danger)'}">${dr.liquido >= 0 ? "" : "−"}${m2(Math.abs(dr.liquido))} ${E(AY.moeda())}</b>${!podeFechar ? " · sem permissão para apurar" : ""}</p>`;
      if (podeFechar) document.getElementById("btnApurar").onclick = () => {
        const dataEscolhida = document.getElementById("fDataApuramento").value;
        if (!dataEscolhida) { AY.toast("Indica a data do apuramento.", "info"); return; }
        if (!confirm("Apurar os resultados do exercício " + ex.nome + ", com data de apuramento " + AY.formatDate(dataEscolhida) + "? Vão ser gerados lançamentos de fecho no diário 81 (Apuramento de Resultados).")) return;
        try { const r = C.apurarResultados({ exercicioId: ex.id, data: dataEscolhida }); render(); renderApuramento();
          AY.toast("Resultados apurados em " + AY.formatDate(dataEscolhida) + ": " + (r.resultado >= 0 ? "lucro" : "prejuízo") + " de " + m2(Math.abs(r.resultado)) + " " + AY.moeda() + ".", "success");
        } catch (ex2) { AY.toast("Erro ao apurar: " + ex2.message, "info"); }
      };
    }
  }

  render();
  renderApuramento();
}
</script>
</body>
</html>
