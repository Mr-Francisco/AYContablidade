<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH — Recibos de Vencimento — SGD</title>
<script>(function(){var t=localStorage.getItem('sgd_theme')||localStorage.getItem('ay_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="container-wide">
    <div class="page-head no-print"><h1>Recibos de Vencimento</h1><p class="sub">Recibo individual por colaborador e mês, pronto a imprimir.</p></div>
    <div class="card no-print">
      <div class="toolbar">
        <label style="margin:0">Mês <select id="fMes"></select></label>
        <label style="margin:0">Colaborador <select id="fColab"></select></label>
        <span style="flex:1"></span>
        <button class="btn btn-outline btn-sm" id="btnImprimir">🖨 Imprimir</button>
      </div>
    </div>
    <div class="card report-print" id="recibo"></div>
  </div>
</main>
<script src="assets/js/app.js"></script>
<script src="assets/js/plano-primavera.js"></script>
<script src="assets/js/contabilidade.js"></script>
<script src="assets/js/rh.js"></script>
<script>
const u = AY.initPage("rh-recibos.html", null);
if (u) {
  const E = AY.escapeHtml, R = AY.rh, C = AY.contab, m2 = AY.formatMoeda2, emp = AY.getEmpresa();
  const selMes = document.getElementById("fMes"), selColab = document.getElementById("fColab");
  (C.PERIODOS || []).filter(p => p[0] >= "01" && p[0] <= "12").forEach(p => selMes.appendChild(new Option(p[0] + " · " + p[1], p[0])));
  selMes.value = String(new Date().getMonth() + 1).padStart(2, "0");
  selColab.innerHTML = R.colaboradores().map(c => `<option value="${c.id}">${E(c.numero)} · ${E(c.nome)}</option>`).join("");

  function render() {
    const c = R.colaborador(selColab.value); if (!c) { document.getElementById("recibo").innerHTML = `<div class="empty">Sem colaboradores.</div>`; return; }
    const r = R.recibo(c, selMes.value), mesLbl = selMes.options[selMes.selectedIndex].text;
    const linha = (l, v, neg) => `<tr><td>${E(l)}</td><td class="num">${neg ? "(" + m2(Math.abs(v)) + ")" : m2(v)}</td></tr>`;
    const extras = [];
    if (r.faltas) extras.push(linha("Desconto por faltas (" + r.faltas + " dia(s))", -r.descFaltas, true));
    if (r.abonosExtra) extras.push(linha("Abonos do mês", r.abonosExtra));
    document.getElementById("recibo").innerHTML = `
      <div class="bal-cabecalho"><div><b>${E(emp.nome)}</b><br><span class="sub">Recibo de Vencimento — ${E(mesLbl)}</span></div><div class="sub">Valores em ${E(AY.moeda())}</div></div>
      <div class="grid-2" style="align-items:start;margin-top:8px">
        <div>
          <p class="sub" style="margin:0"><b>${E(c.nome)}</b> · Nº ${E(c.numero)}</p>
          <p class="sub" style="margin:2px 0">Categoria: ${E(c.categoria || "—")} · Admissão: ${c.dataAdmissao ? AY.formatDate(c.dataAdmissao) : "—"}</p>
        </div>
        <div class="num" style="text-align:right"><span class="sub">Estado do mês: </span>${AY.badge({ por_processar: "Por processar", processado: "Processado", pago: "Pago" }[R.estadoMes(selMes.value)], { por_processar: "#d68910", processado: "#2980b9", pago: "#16a085" }[R.estadoMes(selMes.value)])}</div>
      </div>
      <div class="table-wrap" style="margin-top:10px"><table><tbody>
        ${linha("Salário base", r.base)}${r.subs ? linha("Subsídios", r.subs) : ""}
        ${extras.join("")}
        <tr style="font-weight:700;border-top:2px solid var(--border)"><td>Remuneração bruta</td><td class="num">${m2(r.bruto)}</td></tr>
        ${linha("INSS (3%)", -r.inss, true)}
        <tr><td>Matéria coletável IRT</td><td class="num">${m2(r.materia)}</td></tr>
        ${linha("IRT", -r.irt, true)}
        ${r.descExtra ? linha("Outros descontos", -r.descExtra, true) : ""}
        <tr class="dr-total"><td><b>Líquido a receber</b></td><td class="num"><b>${m2(r.liquido)}</b></td></tr>
      </tbody></table></div>
      <p class="sub" style="margin-top:10px">INSS a cargo da empresa (8%): <b>${m2(r.inssEmpresa)}</b>. Assinatura do colaborador: ___________________________</p>`;
  }
  selMes.onchange = render; selColab.onchange = render;
  document.getElementById("btnImprimir").onclick = () => window.print();
  render();
}
</script>
</body>
</html>
