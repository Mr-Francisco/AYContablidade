# AYContabilidade — a V1 de teste inteira, sem Docker.
#
# UM ficheiro para os DOIS serviços. No painel do Render: New → Blueprint,
# apontar a este repositório. Ele lê isto e cria o backend e o frontend.
#
# PORQUE NÃO DOCKER: o Render constrói com os seus próprios runtimes de Python
# e de Node. Não é preciso ter Docker na máquina de quem lança — e neste caso
# não há, porque a virtualização do Windows não está activada. Os
# `docker-compose` do projecto continuam a servir para quem tiver Docker; este
# caminho existe para quem não tem.
#
# A BASE DE DADOS NÃO ESTÁ AQUI, de propósito: a Postgres gratuita do Render
# **expira 30 dias depois de criada** e leva os dados com ela. Um piloto numa
# empresa real dura mais do que isso. Usa-se o Neon (gratuito, permanente) e
# cola-se a ligação em DATABASE_URL. Ver `docs/LANCAMENTO_V1.md`.
#
# O QUE O PLANO GRATUITO CUSTA: os serviços adormecem ao fim de 15 minutos sem
# pedidos e o primeiro pedido a seguir demora cerca de um minuto a responder.
# Para avaliar comportamento e regras de negócio chega; para o dia-a-dia de uma
# empresa, são 7 USD/mês por serviço para deixar de adormecer.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: aycontabilidade-api
    runtime: python
    plan: free
    region: frankfurt # a região gratuita mais perto de Angola
    rootDir: Producao/backend
    # AS MIGRAÇÕES CORREM AQUI, e não à mão.
    #
    # Duas vezes o mesmo acidente, e da segunda já estava documentado: o Render
    # reconstrói e reinicia sozinho a cada envio, a base de dados não. O código
    # sobe à espera de colunas que ainda não existem, todas as consultas que
    # lhes tocam rebentam, o 500 sai sem cabeçalhos de CORS, o browser bloqueia
    # a resposta — e o que se lê no ecrã é «não foi possível contactar o
    # servidor». Perde-se meia hora a olhar para a rede quando o que falta é
    # uma coluna. Documentar não chegou: o passo tem de deixar de depender de
    # alguém se lembrar.
    #
    # PORQUE NO `buildCommand` E NÃO NO `preDeployCommand`: o
    # `preDeployCommand` é o sítio certo — corre depois de construir, antes de
    # a versão nova entrar ao serviço, e se falhar o Render não troca. Mas
    # EXIGE PLANO PAGO. No plano gratuito não corre de todo, e uma linha que
    # não corre não protege ninguém. Fica no `buildCommand`, que corre sempre.
    #
    # O que se perde com isso: se a construção passar e o arranque falhar, a
    # base fica migrada com o código antigo de pé. Para migrações que só
    # ACRESCENTAM — que são estas — não faz diferença: o código antigo ignora
    # colunas que não conhece. Numa migração que apague ou renomeie, fazer o
    # passo à mão e pela ordem certa (ver `docs/APRENDER_A_LANCAR.md`, § 11).
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    # `/api/health` e não `/docs`: a documentação da API FECHA em produção e
    # devolve 404, e o Render trata uma sonda que não responde 200 como serviço
    # doente — reiniciava-o em ciclo e a instalação nunca chegava a subir.
    # `/api/health` é a única rota sem autenticação do sistema, e é para isto.
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AMBIENTE
        value: producao
      # A ligação do Neon, colada tal como o painel a dá (com `?sslmode=require`).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      # GUARDE ESTA À PARTE, fora do Render. Se se perder, todas as contas com
      # segundo factor têm de o reconfigurar.
      - key: TOTP_CHAVE_CIFRA
        generateValue: true
      # O endereço https do frontend. Em http, ou apontado a localhost, a
      # aplicação RECUSA arrancar e diz porquê — é a rede de segurança contra
      # instalar produção com o `.env` de desenvolvimento.
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODELO
        value: gpt-4o-mini
      - key: PASSWORD_MIN_CARACTERES
        value: "10"

  # --------------------------------------------------------------- frontend --
  - type: web
    name: aycontabilidade-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: Producao/frontend
    # `output: standalone` no `next.config.ts` produz uma pasta que corre sem
    # `node_modules` — mas NÃO copia sozinha os ficheiros estáticos nem a
    # `public/`. Sem estas duas cópias o site abre sem CSS e o modelo .xlsx da
    # AGT dá 404 na hora de gerar o Mapa de Remunerações.
    buildCommand: >-
      npm ci && npm run build &&
      cp -r .next/static .next/standalone/.next/static &&
      cp -r public .next/standalone/public
    # `HOSTNAME=0.0.0.0` NÃO é decoração. O servidor do Next em modo standalone
    # faz `process.env.HOSTNAME || '0.0.0.0'`, e o Render — como qualquer
    # plataforma sobre Kubernetes — define `HOSTNAME` com o nome do contentor.
    # O Next passava a atender só nesse nome; o encaminhador do Render liga por
    # outro caminho, encontrava a porta fechada, e o site respondia 502 com a
    # aplicação viva e a dizer «Ready» nos registos.
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /entrar
    envVars:
      - key: NODE_VERSION
        value: "22"
      # O endereço https do backend — o `https://aycontabilidade-api.onrender.com`
      # que o Render dá ao serviço de cima.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # O endereço público DESTE serviço. Sem ele, a etiqueta canónica, o
      # `og:url` e o `sitemap.xml` apontam para `localhost` — e uma partilha do
      # sistema numa conversa manda quem a recebe para a máquina dele.
      # Mudar aqui no dia em que houver domínio próprio.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://aycontabilidade-web.onrender.com
